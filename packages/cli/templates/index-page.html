<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="noindex,nofollow" />
    <title>{{BRAND_TITLE}} — installable builds</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --ink: #ffffff;
        --ink-dim: rgba(255, 255, 255, 0.62);
        --accent: {{ACCENT}};
        --card: rgba(255, 255, 255, 0.05);
        --card-bd: rgba(255, 255, 255, 0.09);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      body {
        padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
        max-width: 560px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 22px;
      }
      .brand {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      h1 {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.4px;
        margin-bottom: 8px;
      }
      .sub {
        font-size: 13px;
        color: var(--ink-dim);
        line-height: 1.5;
      }
      .build {
        background: var(--card);
        border: 1px solid var(--card-bd);
        border-radius: 16px;
        padding: 14px 15px 15px;
        margin-bottom: 12px;
      }
      .build .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 10px;
      }
      .build .title {
        font-size: 15px;
        font-weight: 700;
      }
      .badge {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
        padding: 3px 7px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink-dim);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      dl {
        display: grid;
        grid-template-columns: 66px 1fr;
        align-items: baseline;
        row-gap: 2px;
        margin-bottom: 13px;
      }
      dt {
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.3px;
        padding: 2px 0;
      }
      dd {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        color: #e6e6ee;
        padding: 2px 0;
        word-break: break-all;
      }
      dd .dim {
        color: rgba(255, 255, 255, 0.45);
      }
      .install-btn {
        display: block;
        text-align: center;
        background: var(--accent);
        color: #000;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 20px;
        border-radius: 999px;
        text-decoration: none;
      }
      .install-btn:active {
        transform: scale(0.98);
      }
      .empty {
        text-align: center;
        color: var(--ink-dim);
        font-size: 14px;
        padding: 40px 0;
      }
      footer {
        text-align: center;
        margin-top: 26px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.34);
        font-family: ui-monospace, Menlo, monospace;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">{{BRAND_TITLE}}</div>
      <h1>Installable builds</h1>
      <p class="sub">
        {{BUILD_COUNT}} build(s) available over the air. Open this page in
        <strong>Safari</strong> on your iPhone and tap Install on any version.
      </p>
    </header>

    <!--
      One card per build, newest first. Each link hands off to the iOS
      installer, which reads that build's own manifest. Builds with different
      bundle ids install side by side, which is what makes comparing two
      versions on one phone possible.
    -->
    {{ROWS}}

    <footer>
      Regenerated {{GENERATED_AT}}<br />
      Not indexed · an install needs this device's UDID in the signing profile
    </footer>
  </body>
</html>
