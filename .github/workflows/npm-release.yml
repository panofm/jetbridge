name: Release (npm)

# Automated npm releases through Changesets. Nothing is published from a
# laptop — this is the only path to npm.
#
# Two phases, decided by whether changesets are pending on main:
#   - A PR lands carrying `.changeset/*.md` → this job runs `changeset version`
#     and opens/updates a "chore(release): version packages" PR that bumps the
#     version, writes the CHANGELOG and deletes the consumed changesets.
#   - That version PR is merged, leaving no changesets → this job builds and
#     runs `changeset publish`, then pushes the git tag.
#
# No token anywhere. npm is restricting tokens that bypass 2FA for direct
# publishing, and a token that needs a code from an authenticator cannot work
# unattended — so the job authenticates as itself through OIDC. Configure the
# trusted publisher once on npmjs.com: the package's Settings, this repository,
# this workflow file.

# Only the two pushes that can produce work trigger this: one that lands a
# changeset, and the version PR's own merge. Every other push to main would
# start a runner to print "nothing to release" and still bill a full minute.
# workflow_dispatch is the manual retry for a publish that died halfway.
on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/cli/package.json'
      - 'packages/cli/CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the version commit, the git tag, the release
  pull-requests: write # open and update the version packages PR
  # Trusted publishing: the job authenticates to npm as itself, so no token is
  # stored anywhere. npm is restricting token-based publishing that skips 2FA,
  # and a token that needs an interactive code cannot work in CI by definition.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history and tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-node is here for the .npmrc it writes, which is what the publish
      # authenticates with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer to exchange the OIDC
      # token; Node 22 ships npm 10, which fails the exchange and reports it as
      # a 404 on the PUT — an error that reads like a missing package.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: bun install --frozen-lockfile

      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Make the run self-explanatory, instead of leaving the outcome buried in
      # the action's logs.
      - name: Summarize outcome
        if: always() && steps.changesets.outcome == 'success'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
        run: |
          set -euo pipefail
          {
            echo "## Release outcome"
            if [ "$PUBLISHED" = "true" ]; then
              echo "📦 **Published to npm:**"
              echo ""
              echo "$PUBLISHED_PACKAGES" \
                | jq -r '.[] | "- `\(.name)@\(.version)` — https://www.npmjs.com/package/\(.name)/v/\(.version)"'
            elif [ -n "$PR_NUMBER" ]; then
              echo "📝 Opened/updated the version packages PR: #$PR_NUMBER"
              echo ""
              echo "Merge it to publish."
            elif [ "$HAS_CHANGESETS" = "true" ]; then
              echo "📝 Changesets are pending — the version PR is being prepared."
            else
              echo "✅ Nothing to release — no pending changesets, and the version is already on npm."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
